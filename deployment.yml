apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
  namespace: nginx-namespace     
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp-container
        image: nginx
        ports:
        - containerPort: 80
         # hostPort: 80

